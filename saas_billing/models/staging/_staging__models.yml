version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: stg_invoices
    columns:
      - name: invoice_id
        tests:
          - unique
          - not_null
      - name: invoice_status
        tests:
          - accepted_values:
              arguments:
                values: ['paid', 'failed', 'refunded']

  - name: stg_plans
    columns:
      - name: plan_id
        tests:
          - unique
          - not_null
      - name: billing_interval
        tests:
          - accepted_values:
              arguments:
                values: ['monthly', 'annual']

  - name: stg_subscriptions
    columns:
      - name: subscription_id
        tests:
          - unique
          - not_null
      - name: subscription_status
        tests:
          - accepted_values:
              arguments:
                values: ['active', 'canceled', 'expired', 'pending'] # Update these to match your actual status values if different!

  - name: stg_support_tickets
    columns:
      - name: ticket_id
        tests:
          - unique
          - not_null